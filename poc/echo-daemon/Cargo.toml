[package]
name = "charon-echo-daemon"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "echo-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
futures-util = "0.3"
